name: Contribution snake

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=%23c4663f&color_dots=%23e4edf9,%23cbb6e0,%23a58fd0,%237a67b8,%2354498f
            dist/snake-dark.svg?palette=github-dark&color_snake=%23f2b58f&color_dots=%231b1a3a,%23453a78,%23685aa8,%238e7fd0,%23c9c0f2

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
